spring:
  application:
    name: family-todo
  datasource:
    # Прагмы действуют на соединение, а не на файл, поэтому едут в URL.
    # foreign_keys обязателен: в SQLite внешние ключи по умолчанию ВЫКЛЮЧЕНЫ,
    # и без него ограничения в схеме были бы декорацией.
    url: jdbc:sqlite:${DB_PATH:./data/family-todo.db}?foreign_keys=true&busy_timeout=5000&journal_mode=WAL
    hikari:
      pool-name: sqlite
      # Одно соединение. В SQLite писатель всё равно один, а пул из одного
      # соединения делает SQLITE_BUSY невозможным вместо того, чтобы лечить
      # его таймаутом. Транзакции здесь короткие: отправка в Telegram всегда
      # вне транзакции, так что очередь из двух потоков ничего не стоит.
      maximum-pool-size: 1
  main:
    # приложение не слушает ни одного порта: long polling — только исходящие
    # соединения. Это же структурная гарантия для теста в задаче 22.
    web-application-type: none

telegram:
  bot:
    token: ${BOT_TOKEN:}
    username: ${BOT_USERNAME:}

logging:
  level:
    root: INFO
    com.familytodo: INFO
