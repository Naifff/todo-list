name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # check, not test: the integration suite runs against a real SQLite file and is
      # where migrations and family isolation are actually proved. A green `test` alone
      # has been misleading in this project before.
      - run: ./gradlew check

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/reports/tests/integrationTest
          retention-days: 7
